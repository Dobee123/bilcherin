<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마지막 손님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#11131A; --veil:rgba(10,12,18,.82); --box:rgba(18,21,30,.92);
    --page:#E9E3D5; --dim:#9AA2B2; --lamp:#F2C879; --line:rgba(233,227,213,.18);
    color-scheme: dark;

    /* 캐릭터 크기·위치. 이 두 값만 만지면 된다.
       --char-h      화면 높이 대비 캐릭터 높이
       --char-bottom 대화 박스 위로 얼마나 띄울지 (작을수록 아래로 내려가 잘린다) */
    --char-h: 62vh;
    --char-bottom: 150px;
  }
  @media (max-width: 760px) {
    :root { --char-h: 46vh; --char-bottom: 190px; }
  }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--night); color:var(--page);
    font-family:"IBM Plex Sans KR",system-ui,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  /* ─── 무대 ─────────────────────────────────────── */
  .stage { position:fixed; inset:0; overflow:hidden; }

  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 8%, #2B2419 0%, transparent 55%),
      radial-gradient(80% 60% at 18% 85%, #1A1D28 0%, transparent 60%),
      linear-gradient(#141720, #0C0E14);
  }
  .bg.has-img { background-size:cover; background-position:center; }
  /* 책장 느낌의 세로선. 배경 이미지가 없을 때만 */
  .shelves {
    position:absolute; inset:0; opacity:.3;
    background:repeating-linear-gradient(90deg,
      transparent 0 46px, rgba(242,200,121,.05) 46px 48px);
    mask-image:linear-gradient(transparent, #000 30%, #000 60%, transparent);
  }
  .bg.has-img + .shelves { display:none; }

  /* 빗줄기 */
  .rain {
    position:absolute; inset:-10% -10% 0; opacity:.22; pointer-events:none;
    background:repeating-linear-gradient(104deg,
      transparent 0 9px, rgba(200,215,235,.5) 9px 10px);
    animation:rain 1.1s linear infinite;
  }
  @keyframes rain { to { transform:translate3d(-44px, 220px, 0); } }

  /* ─── 캐릭터 ───────────────────────────────────── */
  /* 캐릭터 크기는 --char-h 하나로 조절한다.
     ?char=70 처럼 주소에 붙이면 즉시 바꿔볼 수 있다.
     비율은 강제하지 않는다 — 정사각형이든 세로형이든 이미지가 정한다. */
  .char {
    position:absolute; left:50%; bottom:var(--char-bottom);
    transform:translateX(-50%);
    height:var(--char-h); width:auto; max-width:96vw;
    animation:breathe 5.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform:translateX(-50%) translateY(0) scale(1); }
    50%     { transform:translateX(-50%) translateY(-7px) scale(1.012); }
  }
  @media (prefers-reduced-motion:reduce) {
    .char { animation:none; }
    .rain { animation:none; }
  }
  .char img {
    height:100%; width:auto; max-width:96vw;
    object-fit:contain; object-position:bottom center;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.6));
    transition:opacity .34s ease;
  }
  .char img.swap { opacity:0; }

  /* 이미지가 없을 때 — 어떤 표정 칸이 비었는지 보이게 */
  .placeholder {
    height:100%; aspect-ratio:3/4;   /* 이미지가 없을 때만 쓰는 임시 비율 */
    border:1px dashed var(--line); border-radius:3px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; background:rgba(255,255,255,.025); color:var(--dim);
    font-size:13px; text-align:center; padding:16px; line-height:1.7;
  }
  .placeholder .face { font-size:46px; line-height:1; filter:grayscale(.2); }
  .placeholder code { color:var(--lamp); font-size:11.5px; }

  /* ─── 대화 박스 ─────────────────────────────────── */
  .dialogue {
    position:absolute; left:0; right:0; bottom:0;
    padding:0 clamp(14px,4vw,40px)
            calc(clamp(16px,3vh,28px) + env(safe-area-inset-bottom,0px));
  }
  .namebar {
    display:inline-flex; align-items:baseline; gap:9px;
    background:var(--box); border:1px solid var(--line); border-bottom:none;
    padding:7px 17px; font-size:14px; font-weight:500; color:var(--lamp);
    backdrop-filter:blur(7px);
  }
  .namebar .emo { font-size:11.5px; color:var(--dim); font-weight:400; }
  .panel {
    background:var(--box); border:1px solid var(--line);
    backdrop-filter:blur(7px); padding:18px 20px 15px;
  }
  .line {
    font-family:"Gowun Batang",serif; font-size:clamp(15px,2.1vw,17.5px);
    line-height:1.9; margin:0; min-height:5.7em; max-height:5.7em;
    overflow-y:auto; white-space:pre-wrap;
  }
  .caret {
    display:inline-block; width:.45em; height:1em; vertical-align:-.12em;
    background:var(--lamp); margin-left:2px; animation:blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }

  .composer { display:flex; gap:9px; margin-top:13px; align-items:flex-end; }
  textarea {
    flex:1; resize:none; background:rgba(255,255,255,.05);
    border:1px solid var(--line); color:var(--page);
    font:inherit; font-size:15px; padding:10px 12px; min-height:44px; max-height:110px;
    border-radius:2px;
  }
  textarea::placeholder { color:var(--dim); }
  textarea:focus-visible, button:focus-visible, input:focus-visible {
    outline:2px solid var(--lamp); outline-offset:2px;
  }
  textarea:disabled { opacity:.4; }
  button {
    font:inherit; font-size:14px; font-weight:500; padding:11px 19px;
    border:1px solid var(--lamp); background:var(--lamp); color:#1A1508;
    cursor:pointer; border-radius:2px; white-space:nowrap;
  }
  button:disabled { opacity:.35; cursor:default; }
  button.ghost { background:transparent; color:var(--page); border-color:var(--line); }

  .meta {
    position:absolute; top:0; right:0;
    padding:calc(12px + env(safe-area-inset-top,0px)) clamp(14px,4vw,30px) 0 0;
    font-size:12px; color:var(--dim); text-align:right; line-height:1.8;
  }
  .meta b { color:var(--lamp); font-weight:500; font-size:16px; }

  /* ─── 제목 화면 ─────────────────────────────────── */
  .title {
    position:fixed; inset:0; z-index:10; background:var(--veil);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:24px; transition:opacity .5s ease;
  }
  .title.gone { opacity:0; pointer-events:none; }
  .card { width:min(430px,100%); text-align:center; }
  .card h1 {
    font-family:"Gowun Batang",serif; font-weight:700;
    font-size:clamp(30px,8vw,44px); margin:0; letter-spacing:.02em;
  }
  .card .sub { color:var(--dim); font-size:13.5px; margin:10px 0 34px; }
  .card label {
    display:block; text-align:left; font-size:12.5px;
    color:var(--dim); margin-bottom:7px;
  }
  .card input {
    width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line);
    color:var(--page); font:inherit; font-size:16px; padding:12px 14px;
    text-align:center; border-radius:2px;
  }
  .card button { width:100%; margin-top:16px; padding:13px; font-size:15px; }
  .card .note { color:var(--dim); font-size:12px; margin-top:18px; line-height:1.8; }
  .card .err { color:#E08A72; font-size:12.5px; margin-top:14px; min-height:1.3em; }
</style>
</head>
<body>

<div class="stage">
  <div class="bg" id="bg"></div>
  <div class="shelves"></div>
  <div class="rain"></div>

  <div class="meta">닫는 시간까지 <b id="turns">12</b>턴</div>

  <div class="char" id="char"></div>

  <div class="dialogue">
    <div class="namebar">
      <span id="speaker">손님</span>
      <span class="emo" id="emo"></span>
    </div>
    <div class="panel">
      <p class="line" id="line"></p>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="무슨 말을 건네시겠어요?" disabled></textarea>
        <button id="send" disabled>말하기</button>
      </div>
    </div>
  </div>
</div>

<div class="title" id="title">
  <div class="card">
    <h1 id="gameTitle">마지막 손님</h1>
    <p class="sub" id="gameSub">심야 서점 '오후 열한시'</p>
    <label for="name">당신의 이름</label>
    <input id="name" maxlength="12" placeholder="점원의 이름" autocomplete="off">
    <button id="start">문을 연다</button>
    <p class="err" id="err"></p>
    <p class="note">폐점 10분 전. 비에 젖은 남자가 제목을 모르는 책을 찾습니다.<br>
      당신이 무슨 말을 하느냐에 따라 이야기가 끝나는 방식이 달라집니다.</p>
  </div>
</div>

<script>
(function () {
  "use strict";

  const Q = new URLSearchParams(location.search);

  // 서버 주소. 터널로 공개할 때는 ?api=https://... 로 덮어쓸 수 있다.
  const API = Q.get("api") || "http://127.0.0.1:8000";

  // 캐릭터 크기 튜닝: ?char=70&bottom=110 처럼 붙이면 새로고침만으로 비교된다.
  // 마음에 드는 값을 찾으면 위 :root 의 --char-h / --char-bottom 에 적어둔다.
  if (Q.get("char")) {
    document.documentElement.style.setProperty("--char-h", Q.get("char") + "vh");
  }
  if (Q.get("bottom")) {
    document.documentElement.style.setProperty("--char-bottom", Q.get("bottom") + "px");
  }

  const FLAGS = ["사연", "제목", "재고"];
  const FACE = { 평범:"🙂", 기쁨:"😊", 슬픔:"😢", 분노:"😠" };

  const s = {
    name: "", phase: "도입",
    flags: { 사연:false, 제목:false, 재고:false },
    trust: 2, turn: 0, turnsLeft: 12,
    ending: null, beats: [], emotion: "평범",
    slugs: { 평범:"neutral", 기쁨:"happy", 슬픔:"sad", 분노:"angry" },
    speaker: "손님", busy: false, typing: null,
  };

  const $ = (id) => document.getElementById(id);
  const elTitle=$("title"), elName=$("name"), elErr=$("err"), elStart=$("start");
  const elLine=$("line"), elInput=$("input"), elSend=$("send");
  const elTurns=$("turns"), elChar=$("char"), elEmo=$("emo"), elSpeaker=$("speaker");

  /* ── 캐릭터 이미지 ───────────────────────────────
     assets/{slug}.png 를 찾고, 없으면 자리표시자를 그린다.
     이미지를 나중에 넣어도 코드 수정 없이 자동으로 붙는다. */
  const imgCache = {};
  function setEmotion(emo) {
    if (s.emotion === emo && elChar.firstChild) return;
    s.emotion = emo;
    elEmo.textContent = emo;

    const slug = s.slugs[emo] || "neutral";
    if (imgCache[slug] === false) { drawPlaceholder(emo, slug); return; }

    const img = new Image();
    img.onload = () => {
      imgCache[slug] = true;
      const cur = elChar.querySelector("img");
      if (cur) cur.classList.add("swap");
      setTimeout(() => {
        elChar.innerHTML = "";
        img.alt = s.speaker + " · " + emo;
        img.classList.add("swap");
        elChar.appendChild(img);
        requestAnimationFrame(() => img.classList.remove("swap"));
      }, cur ? 160 : 0);
    };
    img.onerror = () => { imgCache[slug] = false; drawPlaceholder(emo, slug); };
    img.src = "assets/" + slug + ".png";
  }
  function drawPlaceholder(emo, slug) {
    elChar.innerHTML =
      '<div class="placeholder"><span class="face">' + (FACE[emo] || "🙂") +
      '</span><span>' + emo + '</span><code>assets/' + slug + '.png</code></div>';
  }

  // 배경도 같은 방식으로
  (function tryBg() {
    const img = new Image();
    img.onload = () => {
      const bg = $("bg");
      bg.classList.add("has-img");
      bg.style.backgroundImage = "url(assets/bg.png)";
    };
    img.src = "assets/bg.png";
  })();

  /* ── 타자 효과 ──────────────────────────────────── */
  function type(text) {
    clearInterval(s.typing);
    elLine.textContent = "";
    const caret = document.createElement("span");
    caret.className = "caret";
    elLine.appendChild(caret);
    let i = 0;
    s.typing = setInterval(() => {
      if (i >= text.length) {
        clearInterval(s.typing); caret.remove(); return;
      }
      caret.before(document.createTextNode(text[i++]));
      elLine.scrollTop = elLine.scrollHeight;
    }, 22);
  }
  function showAll(text) {
    clearInterval(s.typing);
    elLine.textContent = text;
  }
  // 타자 중 아무 데나 누르면 즉시 전부 표시
  elLine.addEventListener("click", () => {
    const full = s.beats[s.beats.length - 1];
    if (full) showAll(full);
  });

  function lock(on) {
    s.busy = on;
    const off = on || !!s.ending;
    elInput.disabled = off; elSend.disabled = off;
  }

  /* ── 진행 ───────────────────────────────────────── */
  function history() {
    return s.beats.slice(-8);
  }

  async function takeTurn(action) {
    lock(true);
    showAll("…");
    try {
      const r = await fetch(API + "/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          phase: s.phase, flags: s.flags, trust: s.trust,
          turn: s.turn, turnsLeft: s.turnsLeft,
          history: history(), action, playerName: s.name,
        }),
      });
      if (!r.ok) {
        let d = "";
        try { d = JSON.stringify((await r.json()).detail); } catch (_) {}
        throw new Error("HTTP " + r.status + (d ? " · " + d : ""));
      }
      const out = await r.json();

      s.flags = out.flags; s.trust = out.trust;
      s.turn = out.turn; s.turnsLeft = out.turnsLeft;
      s.phase = out.phase; s.ending = out.ending;
      elTurns.textContent = s.turnsLeft;

      const text = out.narration || "(…)";
      s.beats.push("[점원] " + action);
      s.beats.push("[장면] " + text);
      setEmotion(out.emotion || "평범");
      type(text);

      if (s.ending) {
        elSpeaker.textContent = "결말 · " + s.ending;
        elInput.placeholder = "이야기가 끝났습니다";
        const b = document.createElement("button");
        b.className = "ghost"; b.textContent = "다시 시작";
        b.onclick = () => location.reload();
        elSend.replaceWith(b);
        lock(true);
        return;
      }
      lock(false); elInput.focus();
    } catch (e) {
      s.beats.pop();
      showAll("연결에 문제가 생겼습니다.\n" + e.message);
      lock(false);
    }
  }

  function submit() {
    const v = elInput.value.trim();
    if (!v || s.busy || s.ending) return;
    elInput.value = ""; elInput.style.height = "auto";
    takeTurn(v);
  }
  elSend.addEventListener("click", submit);
  elInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  elInput.addEventListener("input", () => {
    elInput.style.height = "auto";
    elInput.style.height = Math.min(110, elInput.scrollHeight) + "px";
  });

  /* ── 시작 ───────────────────────────────────────── */
  let meta = null;
  (async function loadMeta() {
    try {
      const r = await fetch(API + "/meta");
      meta = await r.json();
      $("gameTitle").textContent = meta.title || "마지막 손님";
      $("gameSub").textContent = meta.subtitle || "";
      document.title = meta.title || document.title;
      s.speaker = meta.characterName || "손님";
      elSpeaker.textContent = s.speaker;
      s.turnsLeft = meta.turnsStart || 12;
      elTurns.textContent = s.turnsLeft;
      if (meta.emotionSlugs) s.slugs = meta.emotionSlugs;
      elErr.textContent = "";
    } catch (_) {
      elErr.textContent = "서버에 연결하지 못했습니다. 04_serve.py 를 먼저 실행하세요.";
    }
  })();

  function start() {
    const n = elName.value.trim();
    if (!n) { elErr.textContent = "이름을 입력해 주세요."; elName.focus(); return; }
    s.name = n;
    elTitle.classList.add("gone");
    setTimeout(() => elTitle.remove(), 520);
    setEmotion("평범");
    const open = (meta && meta.opening) ||
      "문에 달린 종이 두 번 울린다. 검은 코트를 입은 남자가 들어선다.";
    s.beats.push("[장면] " + open);
    type(open);
    lock(false);
    setTimeout(() => elInput.focus(), 560);
  }
  elStart.addEventListener("click", start);
  elName.addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });
  elName.focus();
})();
</script>
</body>
</html>
